name: Build and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack binary assets into site/
        run: |
          set -e
          cat assets/assets.tgz.b64.part* | base64 -d > /tmp/assets.tgz
          echo "81a7ea1eebe86a1a4a78f9bf263aece11c85ca19e9029bc7be13bf2328f38b93  /tmp/assets.tgz" | sha256sum -c -
          tar xzf /tmp/assets.tgz -C site
          test -f site/index.html && test -f site/assets/og-image.jpg && test -f site/favicon.ico && grep -qx johnandcoheritage.com site/CNAME
          find site -type f | sort
      - name: Publish site/ to the gh-pages branch
        run: |
          set -e
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
