name: Build and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack binary assets into site/
        run: |
          set -e
          cat assets/assets.tgz.b64.part* | base64 -d > /tmp/assets.tgz
          echo "c5490aeea3a4f43ddf6f0acfcc034592507e76304bff3f444bf60dd21ec2aa34  /tmp/assets.tgz" | sha256sum -c -
          tar xzf /tmp/assets.tgz -C site
          test -f site/index.html && test -f site/assets/og-image.jpg
          find site -type f | sort
      - name: Publish site/ to the gh-pages branch
        run: |
          set -e
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
